name: ci

on:
  push:
  pull_request:

# CPU-only CI. No GPU, no model weights. The foundation must lint, type-check, and
# pass tests without torch/transformers/moshi/mimi.
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install foundation + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check shared edge speech aux memory safety infra evals training tests

      - name: Format check (ruff)
        run: ruff format --check shared edge speech aux memory safety infra evals training tests

      - name: Type check (mypy)
        run: mypy

      - name: Import smoke test (CPU-only)
        run: python -c "import shared.contracts; print('shared.contracts OK')"

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

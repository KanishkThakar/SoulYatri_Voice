# =============================================================================
# SoulYatri — Full local stack (final_use.md §16C release hardening)
# =============================================================================
# Extends the root docker-compose.yml patterns (LiveKit + Redis) and adds the rest of
# the frozen model-stack data services from final_use.md §2.2:
#   * Postgres  -> profile / relational store (memory L4)
#   * Qdrant    -> semantic vector store (memory L3)
#   * server    -> the FastAPI voice pipeline (built from infra/docker/Dockerfile.server)
#   * prometheus-> scrapes /metrics using infra/monitoring/prometheus.yml
#
# The root docker-compose.yml is NOT modified. Run from the repo root, e.g.:
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.full.yml up
#
# Image tags are pinned by minor version; pin exact digests in production
# (see infra/docker/PINNED_VERSIONS.md).

services:
  # ---------------------------------------------------------------------------
  # LiveKit — WebRTC signaling and media relay (mirrors root compose service)
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.8
    container_name: soulyatri-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secret"
    command: --dev --bind 0.0.0.0
    restart: unless-stopped
    networks:
      - soulyatri

  # ---------------------------------------------------------------------------
  # Redis — Session cache and hot memory (L2)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: soulyatri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - soulyatri

  # ---------------------------------------------------------------------------
  # Postgres — profile / relational store (memory L4)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soulyatri-postgres
    environment:
      POSTGRES_DB: soulyatri
      POSTGRES_USER: soulyatri
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulyatri"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soulyatri

  # ---------------------------------------------------------------------------
  # Qdrant — semantic vector store (memory L3)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: soulyatri-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - soulyatri

  # ---------------------------------------------------------------------------
  # Server — FastAPI voice pipeline (/metrics exposed for Prometheus)
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    container_name: soulyatri-server
    depends_on:
      - livekit
      - redis
      - postgres
      - qdrant
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: soulyatri
      POSTGRES_USER: soulyatri
      POSTGRES_PASSWORD: change-me
      QDRANT_URL: http://qdrant:6333
      WHISPER_DEVICE: cpu
      EMOTION_DEVICE: cpu
      SPEAKER_DEVICE: cpu
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - soulyatri

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes the server's /metrics (config: infra/monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: soulyatri-prometheus
    depends_on:
      - server
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - soulyatri

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  prometheus_data:

networks:
  soulyatri:
    driver: bridge

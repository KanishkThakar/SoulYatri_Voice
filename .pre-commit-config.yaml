# SoulYatri pre-commit hooks — CPU-only, no GPU/model weights required.
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Lint (foundation packages; client/server excluded via pyproject extend-exclude)
      - id: ruff
        args: ["--fix"]
        files: ^(shared|edge|speech|aux|memory|safety|infra|evals|training|tests)/
      # Format
      - id: ruff-format
        files: ^(shared|edge|speech|aux|memory|safety|infra|evals|training|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Scoped to the foundation contracts so hooks stay fast and CPU-only.
        files: ^(shared|tests)/
        additional_dependencies:
          - "pydantic>=2.9.0"

  - repo: local
    hooks:
      # Fast contract tests on every commit. Scoped, no GPU, no heavy deps.
      - id: pytest-contracts
        name: pytest (shared contracts)
        entry: python -m pytest tests/test_contracts.py -q
        language: system
        pass_filenames: false
        always_run: true
